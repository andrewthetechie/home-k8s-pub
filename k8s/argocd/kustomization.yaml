apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
metadata:
  name: argocd

resources:
  - namespace.yaml
  - ingress.yaml
  - sealed-secret-repo.yaml
  - project-apps.yaml
  - project-infra.yaml
  - app-argocd.yaml
  - appset-apps.yaml
  - appset-infra.yaml
patches:
  - path: configmap.yaml

helmCharts:
  - includeCRDs: true
    name: argo-cd
    namespace: argocd
    releaseName: argocd
    repo: https://argoproj.github.io/argo-helm
    valuesInline:
      global:
        deploymentAnnotations:
          configmap.reloader.stakater.com/reload: argocd-cm,argocd-rbac-cm
        image:
          tag: v2.14.21
      server:
        extraArgs:
          - --insecure
      configs:
        rbac:
          policy.default: role:admin
      redis:
        image:
          tag: 7.4.1-alpine
    version: 7.9.1
