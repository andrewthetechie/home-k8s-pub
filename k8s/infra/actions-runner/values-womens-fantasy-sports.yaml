githubConfigUrl: https://github.com/andrewthetechie/womens-fantasy-sports
githubConfigSecret: arc-github-app

maxRunners: 6

runnerScaleSetName: womens-fantasy-sports

# DinD gives each runner pod its own Docker daemon, required for jobs that
# build images or use docker/docker-compose steps.
containerMode:
  type: "dind"


# Explicitly reference the controller SA so the chart can create RoleBindings
# when the controller is in a different namespace (arc-systems).
# SA name follows the pattern: {controllerReleaseName}-gha-rs-controller (chart truncates the name)
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

template:
  spec:
    # Spread this scale set's runner pods across nodes. A CI fan-out (e.g. 4
    # playwright shards) landing on one node saturates its disk/CPU with
    # concurrent multi-GB `docker load`/untar, stretching the "Load images"
    # step from ~4 min to 11-14 min per shard (observed 2026-08-09, all 4
    # shards on alex; one shard hit the 15-min job timeout as a result).
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            actions.github.com/scale-set-name: womens-fantasy-sports
    volumes:
      - name: buildkitd-config
        configMap:
          name: buildkitd-config
      - name: dind-daemon-config
        configMap:
          name: dind-daemon-config
    containers:
      - name: runner
        # falcondev fork of the actions runner: reads CUSTOM_ACTIONS_RESULTS_URL
        # so the pod can point actions/cache at the self-hosted cache server
        # (the stock runner ignores ACTIONS_RESULTS_URL — GitHub injects its own).
        # :latest deliberately, not a digest pin: GitHub rejects outdated runners,
        # and this fork is the critical currency risk of the whole cache project.
        image: ghcr.io/falcondev-oss/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: BUILDKIT_HOST
            value: tcp://127.0.0.1:1234
          - name: CUSTOM_ACTIONS_RESULTS_URL
            value: "https://actions-cache.herrington.services/"
      - name: buildkitd
        image: moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8  # v0.32.2
        args:
          - --addr
          - tcp://0.0.0.0:1234
          - --config
          - /etc/buildkit/buildkitd.toml
        securityContext:
          privileged: true
        volumeMounts:
          - name: buildkitd-config
            mountPath: /etc/buildkit
      # Override the chart-injected dind container to mount daemon.json, giving
      # dind: (1) trust for registry-local (required for shard image pulls after
      # prepare-images pushes built images there) and (2) registry-dockerhub as
      # a docker.io mirror so `docker compose pull` hits the LAN instead of Hub.
      # Chart-managed volumes (dind-sock, dind-externals, work) must be listed
      # explicitly when overriding the container spec, as the chart won't inject
      # them if it finds an existing dind entry in template.spec.containers.
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-daemon-config
            mountPath: /etc/docker/daemon.json
            subPath: daemon.json
