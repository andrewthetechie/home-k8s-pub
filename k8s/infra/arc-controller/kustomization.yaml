apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arc-systems

resources:
  - namespace.yaml

helmCharts:
  - name: gha-runner-scale-set-controller
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    releaseName: arc-controller
    namespace: arc-systems
    # Check https://github.com/actions/actions-runner-controller/releases for latest
    # 0.14.2 -> 0.15.0: fixes AutoscalingRunnerSet permanently stuck in Outdated phase
    # (actions/actions-runner-controller#4596, #4595), fixed by PRs #4644 and #4660.
    version: 0.15.1
    includeCRDs: true
