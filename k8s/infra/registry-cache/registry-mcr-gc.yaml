# Nightly GC for registry-mcr (pull-through proxy cache).
# Same design as registry-local-gc.yaml; see that file for the mechanism.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-mcr-gc
  namespace: registry-cache
spec:
  schedule: "30 5 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: registry-gc
          containers:
            - name: gc-orchestrator
              image: alpine/k8s:1.28.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  NS=registry-cache
                  D=registry-mcr
                  kubectl -n "$NS" delete job "$D-gc-exec" --ignore-not-found --wait=false >/dev/null 2>&1 || true
                  kubectl -n "$NS" apply -f /gc/"$D".yaml
                  kubectl -n "$NS" wait --for=condition=complete job/"$D-gc-exec" --timeout=900s
                  kubectl -n "$NS" delete job "$D-gc-exec" --ignore-not-found --wait=false >/dev/null 2>&1 || true
              volumeMounts:
                - name: executors
                  mountPath: /gc
          volumes:
            - name: executors
              configMap:
                name: registry-gc
