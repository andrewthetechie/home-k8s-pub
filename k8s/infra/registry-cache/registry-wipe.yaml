                    matchLabels:
                      app: registry-ghcr
                  topologyKey: kubernetes.io/hostname
                  namespaces: [registry-cache]
          containers:
            - name: wipe
              image: busybox:1.36
              command: ["/bin/sh", "-c"]
              args:
                - >
                  rm -rf /var/lib/registry/docker &&
                  mkdir -p /var/lib/registry/docker/registry/v2/repositories
                  /var/lib/registry/docker/registry/v2/blobs
              volumeMounts:
                - name: data
                  mountPath: /var/lib/registry
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: registry-ghcr
  registry-mcr.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
