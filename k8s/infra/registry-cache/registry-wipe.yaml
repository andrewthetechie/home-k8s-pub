  registry-local.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: registry-local-wipe-exec
      namespace: registry-cache
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: registry-local
                  topologyKey: kubernetes.io/hostname
