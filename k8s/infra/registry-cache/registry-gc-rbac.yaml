# RBAC for the nightly registry GC orchestrators. The CronJob pod applies the
# executor Job from the registry-gc ConfigMap (scheduled on the registry's node
# via podAffinity so it can mount the RWO PVC while the registry keeps
# running), waits for it to finish, then deletes it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-gc
  namespace: registry-cache
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-gc
  namespace: registry-cache
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-gc
  namespace: registry-cache
subjects:
  - kind: ServiceAccount
    name: registry-gc
    namespace: registry-cache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-gc
