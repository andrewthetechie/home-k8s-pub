apiVersion: v1
kind: PersistentVolume
metadata:
  name: registry-dockerhub
spec:
  capacity: { storage: 200Gi }        # advisory only; NFS does not enforce
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, noatime, nconnect=8]
  nfs:
    server: duarte.herrington.services
    path: /mnt/storage/runners-cache/registry-dockerhub
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-dockerhub
  namespace: registry-cache
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: registry-dockerhub
  resources:
    requests: { storage: 200Gi }
