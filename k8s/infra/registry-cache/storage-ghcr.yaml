# Registry blob store. Was a static NFS PV on duarte; duarte NFS stalls were
# killing cache writes, and a single-replica registry never needed RWX. Now a
# dynamic iSCSI zvol on chrisjen (freenas-iscsi-csi). Cache data is disposable:
# loss just re-warms from upstream. Kept bounded by the nightly scale-to-zero
# GC cronjobs (registry-*-gc).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-ghcr
  namespace: registry-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: freenas-iscsi-csi
  resources:
    requests: { storage: 200Gi }
