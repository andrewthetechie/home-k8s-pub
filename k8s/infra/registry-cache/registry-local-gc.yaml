# Nightly GC for registry-local.
#
# Applies the executor Job from the registry-gc ConfigMap; the executor
# schedules on the registry pod's node (podAffinity) so it can mount the RWO
# iSCSI PVC while the registry keeps running. See registry-gc.yaml for why
# scale-to-zero was rejected (ArgoCD selfHeal races the scale-down).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-local-gc
  namespace: registry-cache
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: registry-gc
          containers:
            - name: gc-orchestrator
              image: alpine/k8s:1.28.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  NS=registry-cache
                  D=registry-local
                  kubectl -n "$NS" delete job "$D-gc-exec" --ignore-not-found --wait=false >/dev/null 2>&1 || true
                  kubectl -n "$NS" apply -f /gc/"$D".yaml
                  kubectl -n "$NS" wait --for=condition=complete job/"$D-gc-exec" --timeout=900s
                  kubectl -n "$NS" delete job "$D-gc-exec" --ignore-not-found --wait=false >/dev/null 2>&1 || true
              volumeMounts:
                - name: executors
                  mountPath: /gc
          volumes:
            - name: executors
              configMap:
                name: registry-gc
