apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-local-gc
  namespace: registry-cache
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            # GC's mark phase fails with "Path not found: /docker/registry/v2/repositories"
            # when the store is empty; ensure the tree exists before running.
            - name: ensure-repos-dir
              image: busybox:1.36
              command: ["/bin/sh", "-c"]
              args: ["mkdir -p /var/lib/registry/docker/registry/v2/repositories /var/lib/registry/docker/registry/v2/blobs"]
              volumeMounts:
                - name: data
                  mountPath: /var/lib/registry
          containers:
            - name: gc
              image: registry:2.8.3
              command:
                - registry
                - garbage-collect
                - --delete-untagged
                - /etc/docker/registry/config.yml
              volumeMounts:
                - name: data
                  mountPath: /var/lib/registry
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: registry-local
