# Pull-through cache for mcr.microsoft.com. Same design as registry-ghcr;
# the BuildKit sidecar's mirror config routes mcr pulls here, so the big
# playwright base image comes off the LAN after the first fetch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-mcr
  namespace: registry-cache
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO iSCSI volume; never run two pods
  selector:
    matchLabels: { app: registry-mcr }
  template:
    metadata:
      labels: { app: registry-mcr }
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: "https://mcr.microsoft.com"
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
          livenessProbe:
            httpGet: { path: /v2/, port: 5000 }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-mcr
---
apiVersion: v1
kind: Service
metadata:
  name: registry-mcr
  namespace: registry-cache
spec:
  selector: { app: registry-mcr }
  ports:
    - port: 5000
      targetPort: 5000
