apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-local
  namespace: registry-cache
spec:
  replicas: 1
  strategy:
    type: Recreate          # NFS-backed; never run two writers
  selector:
    matchLabels: { app: registry-local }
  template:
    metadata:
      labels: { app: registry-local }
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
          livenessProbe:
            httpGet: { path: /v2/, port: 5000 }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-local
---
apiVersion: v1
kind: Service
metadata:
  name: registry-local
  namespace: registry-cache
spec:
  selector: { app: registry-local }
  ports:
    - port: 5000
      targetPort: 5000
