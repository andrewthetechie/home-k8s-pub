# NodePort twin of registry-local for the standalone runner box (10.10.0.31).
# The box is not a cluster member and cannot resolve ClusterIP DNS, but its
# workflows hardcode registry-local.registry-cache.svc.cluster.local:5000
# (buildx cache refs; womens-fantasy-sports pushes images then pulls them back).
# The box socat-forwards its own :5000 to nodeIP:30500 — see
# ../actions-runner/STANDALONE-RUNNER-BOX.md.
apiVersion: v1
kind: Service
metadata:
  name: registry-local-nodeport
  namespace: registry-cache
  labels:
    app: registry-local
spec:
  type: NodePort
  selector:
    app: registry-local
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
