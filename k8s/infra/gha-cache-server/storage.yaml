# Blob store. Was a static NFS PV on duarte; duarte NFS stalls were killing
# cache writes (same root cause as the registry-cache failures), and the cache
# server is single-replica so it never needed RWX. Now a dynamic iSCSI zvol on
# chrisjen (freenas-iscsi-csi). Data is disposable cache — loss just re-warms —
# and the server's internal cleanup tasks (CACHE_CLEANUP_OLDER_THAN_DAYS) keep
# it bounded.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gha-cache-blobs
  namespace: gha-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: freenas-iscsi-csi
  resources:
    requests: { storage: 300Gi }
---
# SQLite metadata DB. Block storage (iSCSI SSD); keep on SSD — a corrupted DB
# invalidates the whole cache index.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gha-cache-db
  namespace: gha-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: freenas-iscsi-ssd-csi
  resources:
    requests: { storage: 5Gi }
