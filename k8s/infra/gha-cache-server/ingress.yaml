apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gha-cache-server
  namespace: gha-cache
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # This cluster runs the NGINX Inc. controller (nginx.org/ingress-controller,
    # chart infra/nginx-ingress), NOT community ingress-nginx — so the
    # nginx.ingress.kubernetes.io/* annotation set is ignored here. The NGINX
    # controller equivalents:
    # - client_max_body_size defaults to 1m; the global ConfigMap raises it to
    #   20m, still far below cache artifact sizes. 0 = unlimited. Not optional.
    nginx.org/client-max-body-size: "0"
    # Default proxy timeouts are 60s; large caches over the uplink need more.
    nginx.org/proxy-read-timeout: "600s"
    nginx.org/proxy-send-timeout: "600s"
spec:
  tls:
    - hosts: [actions-cache.herrington.services]
      secretName: actions-cache-tls-cert
  rules:
    - host: actions-cache.herrington.services
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gha-cache-server
                port: { number: 3000 }
