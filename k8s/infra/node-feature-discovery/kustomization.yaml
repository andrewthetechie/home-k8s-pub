apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: node-feature-discovery

resources:
  - namespace.yaml

helmCharts:
  - name: node-feature-discovery
    includeCRDs: true
    namespace: node-feature-discovery
    releaseName: node-feature-discovery
    version: 0.19.0
    repo: https://kubernetes-sigs.github.io/node-feature-discovery/charts
    valuesInline:
      # NOTE: master.resourceLabels was removed upstream in chart 0.19.0 (silently ignored).
      # It was inert on this cluster (no matching labels/resources) and the GPU extended
      # resources are covered by the intel-device-plugin `intel-gpu-platform-labeling`
      # NodeFeatureRule. Migrate to a NodeFeatureRule here if ever needed again.
      master:
        extraLabelNs:
          - gpu.intel.com
          - sgx.intel.com
      worker:
        sources:
          usb:
            deviceLabelFields: [class, vendor, device, serial]
patches:
  - target:
      kind: ConfigMap
      name: node-feature-discovery-worker-conf
    patch: |-
      - op: replace
        path: /data/nfd-worker.conf
        value: |-
          sources:
            usb:
              deviceLabelFields:
                - "class"
                - "vendor"
                - "device"
                - "serial"
            pci:
              deviceLabelFields:
                - "class"
                - "vendor"
                - "device"
                - "subsystem_vendor"
                - "subsystem_device"
