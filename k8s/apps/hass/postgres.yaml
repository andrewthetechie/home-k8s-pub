kind: "postgresql"
apiVersion: "acid.zalan.do/v1"

metadata:
  name: "hass-db"
  namespace: "hass"
  labels:
    team: hass
    app.kubernetes.io/instance: hass
    app.kubernetes.io/name: home-assistant
spec:
  teamId: "hass"
  postgresql:
    version: "15"
    parameters:
      shared_buffers: 256MB
      work_mem: 16MB
      tcp_keepalives_idle: "30"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "5"
      idle_in_transaction_session_timeout: "60000"
      random_page_cost: "1.1"
      # HA recorder tables are INSERT-heavy (170k rows/day). Default scale factors
      # (0.2 insert / 0.05 vacuum) meant autovacuum never fired on the big tables
      # until they were millions of rows over threshold, letting bloat accumulate.
      # Aggressive thresholds keep vacuum engaged on this single-purpose DB.
      autovacuum_vacuum_scale_factor: "0.01"
      autovacuum_vacuum_insert_scale_factor: "0.01"
      autovacuum_analyze_scale_factor: "0.01"
      autovacuum_vacuum_cost_limit: "1000"
  numberOfInstances: 1
  enableMasterLoadBalancer: false
  enableConnectionPooler: false
  users:
    hass: []
  databases:
    hass: hass
  volume:
    size: "70Gi"
    storageClass: freenas-iscsi-ssd-csi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi