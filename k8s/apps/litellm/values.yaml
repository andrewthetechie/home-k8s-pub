replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm-database
  tag: "1.95.0"
  pullPolicy: IfNotPresent

# Use the Zalando postgres operator cluster (postgres.yaml) instead of the
# chart's bundled postgres. The operator creates a credentials secret named
# litellm.litellm-db.credentials.postgresql.acid.zalan.do once the cluster
# is up; the proxy will crash-loop until that exists — expected on first sync.
db:
  useExisting: true
  deployStandalone: false
  endpoint: "litellm-db.litellm.svc.cluster.local"
  database: litellm
  secret:
    name: litellm.litellm-db.credentials.postgresql.acid.zalan.do
    usernameKey: username
    passwordKey: password

# Enable the bundled Bitnami Redis subchart. The chart wires REDIS_HOST /
# REDIS_PORT / REDIS_PASSWORD into the proxy and renders a
# general_settings.coordination_redis block into the config automatically.
redis:
  enabled: false 

# Master key lives in the sealed secret (key: masterkey). The chart injects it
# as PROXY_MASTER_KEY, referenced by general_settings.master_key below.
masterkeySecretName: litellm-secrets
masterkeySecretKey: masterkey

# Export LITELLM_SALT_KEY (and anything else in the sealed secret) as env vars.
environmentSecrets:
  - litellm-secrets

# Manage models/keys from the Admin UI instead of the config file.
envVars:
  STORE_MODEL_IN_DB: "True"

# The migrations Job retries until the Zalando operator has provisioned the
# postgres cluster. Do NOT run it as an ArgoCD PreSync hook: hooks run before
# normal resources, so the postgres CR would never be applied and the hook
# would block the sync forever. As a normal resource it just retries.
migrationJob:
  hooks:
    argocd:
      enabled: false
  backoffLimit: 30

proxy_config:
  model_list: []
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Raise the ingress proxy timeouts from the NGINX IC default of 60s to
    # comfortably exceed LiteLLM's long-reasoning models. glm-5.3/glm-4.7 need
    # well over 600s for long chain-of-thought, and their litellm deployment
    # timeout is set to 3600s, so nginx must wait at least as long (otherwise
    # nginx 504s at 600s before litellm/glm finish -> 10-min retry recycle).
    # See INCIDENT-2026-09-14-504.md.
    nginx.org/proxy-read-timeout: "3600"
    nginx.org/proxy-send-timeout: "3600"
  hosts:
    - host: litellm.herrington.services
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: litellm-tls
      hosts:
        - litellm.herrington.services
