apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: open-webui

resources:
  - namespace.yaml
  - sealed-open-webui-secrets.yaml

helmCharts:
  - name: open-webui
    releaseName: open-webui
    namespace: open-webui
    version: 16.1.0
    repo: https://helm.openwebui.com/
    valuesFile: values.yaml
