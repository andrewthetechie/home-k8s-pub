controllers:
  flakeradar:
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: ghcr.io/andrewthetechie/home-k8s-pub/flakeradar
          tag: f129c284ce7a64f9efc31e881664485313b9fdbd@sha256:6e4a26f035e68f6ca978e72b2c7fef4d6dd803a9f0bf6c3743c0f7de8a9d4687
          pullPolicy: IfNotPresent
        env:
          FLAKERADAR_DATABASE_URL: "sqlite:////srv/backend/data/flakeradar.db"
          FLAKERADAR_API_TOKEN:
            valueFrom:
              secretKeyRef:
                name: flakeradar-secrets
                key: FLAKERADAR_API_TOKEN
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 8000
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 8000
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /srv/backend/data

service:
  flakeradar:
    controller: flakeradar
    ports:
      http:
        port: 8000

ingress:
  flakeradar:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      gethomepage.dev/enabled: "false"
    hosts:
      - host: flakes.herrington.services
        paths:
          - path: /
            service:
              identifier: flakeradar
              port: http
    tls:
      - secretName: flakeradar
        hosts:
          - flakes.herrington.services
