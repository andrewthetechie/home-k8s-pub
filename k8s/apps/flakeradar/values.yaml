controllers:
  flakeradar:
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: ghcr.io/andrewthetechie/flakeradar
          tag: sha-78e011b
          pullPolicy: IfNotPresent
        # Build the PostgreSQL DSN at runtime from the postgres-operator
        # credentials secret. app-template cannot concatenate two secret refs
        # into a single env var, so we compose FLAKERADAR_DATABASE_URL here and
        # exec the image's default uvicorn command. The app image runs Alembic
        # migrations itself on startup (advisory-locked across workers).
        command:
          - /bin/sh
          - -ec
          - 'export FLAKERADAR_DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@flakeradar-db:5432/flakeradar" && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2'
        env:
          FLAKERADAR_API_TOKEN:
            valueFrom:
              secretKeyRef:
                name: flakeradar-secrets
                key: FLAKERADAR_API_TOKEN
          FLAKERADAR_FLAKE_THRESHOLD: "0.30"
          FLAKERADAR_SCORE_WINDOW: "50"
          FLAKERADAR_SCORE_DECAY: "0.85"
          FLAKERADAR_CORS_ORIGINS: https://flakes.herrington.services
          POSTGRES_USER:
            valueFrom:
              secretKeyRef:
                name: flakeradar.flakeradar-db.credentials.postgresql.acid.zalan.do
                key: username
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: flakeradar.flakeradar-db.credentials.postgresql.acid.zalan.do
                key: password
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 8000
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 8000
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi

service:
  flakeradar:
    controller: flakeradar
    ports:
      http:
        port: 8000

ingress:
  flakeradar:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      gethomepage.dev/enabled: "false"
    hosts:
      - host: flakes.herrington.services
        paths:
          - path: /
            service:
              identifier: flakeradar
              port: http
    tls:
      - secretName: flakeradar
        hosts:
          - flakes.herrington.services
