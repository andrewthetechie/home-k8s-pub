controllers:
  flakeradar:
    # Cutover from the 0.1.x Python server: stop the old deployment first
    # (docs/cutover-rust.md step 2), so Recreate rather than RollingUpdate.
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/andrewthetechie/flakeradar
          tag: sha-6ecd2e7
          pullPolicy: IfNotPresent
        # FlakeRadar 0.2 is the Rust rewrite: one binary, distroless image, no
        # shell and no uvicorn, so the DSN has to reach it as a plain env var.
        # Kubernetes expands $(VAR) in an env value from variables defined
        # earlier in the same list, and app-template's dependsOn orders them,
        # so the postgres-operator credentials are spliced into the URL at
        # container start without duplicating the password anywhere.
        #
        # The database is flakeradar_rust, not flakeradar: 0.2 refuses to start
        # on a database the Python server created (it has an alembic_version
        # table) and creates its whole schema on first start instead. No data
        # is carried over, so the old database is dropped.
        env:
          DB_USER:
            valueFrom:
              secretKeyRef:
                name: flakeradar.flakeradar-db.credentials.postgresql.acid.zalan.do
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: flakeradar.flakeradar-db.credentials.postgresql.acid.zalan.do
                key: password
          FLAKERADAR_DATABASE_URL:
            value: postgresql://$(DB_USER):$(DB_PASSWORD)@flakeradar-db:5432/flakeradar_rust
            dependsOn:
              - DB_USER
              - DB_PASSWORD
          FLAKERADAR_API_TOKEN:
            valueFrom:
              secretKeyRef:
                name: flakeradar-secrets
                key: FLAKERADAR_API_TOKEN
          FLAKERADAR_FLAKE_THRESHOLD: "0.30"
          FLAKERADAR_SCORE_WINDOW: "50"
          FLAKERADAR_SCORE_DECAY: "0.85"
          FLAKERADAR_CORS_ORIGINS: https://flakes.herrington.services
          # FLAKERADAR_GITHUB_TOKEN is deliberately unset: on a fresh database
          # the filing gate would open issues on almost no evidence, so issue
          # automation stays off until scores rebuild (~1 week of CI runs).
          # docs/cutover-rust.md step 5 and step 9.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 8000
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health/ready
                port: 8000
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi

service:
  flakeradar:
    controller: flakeradar
    ports:
      http:
        port: 8000

ingress:
  flakeradar:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      gethomepage.dev/enabled: "false"
    hosts:
      - host: flakes.herrington.services
        paths:
          - path: /
            service:
              identifier: flakeradar
              port: http
    tls:
      - secretName: flakeradar
        hosts:
          - flakes.herrington.services
