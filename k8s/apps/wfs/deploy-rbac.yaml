apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wfs-deploy
  namespace: wfs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wfs-deploy-runners
  namespace: wfs
subjects:
  - kind: ServiceAccount
    name: womens-fantasy-sports-gha-rs-no-permission
    namespace: arc-runners
roleRef:
  kind: Role
  name: wfs-deploy
  apiGroup: rbac.authorization.k8s.io
