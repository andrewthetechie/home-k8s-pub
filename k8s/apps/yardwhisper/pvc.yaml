apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yardwhisper-uploads
  namespace: yardwhisper
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: freenas-iscsi-ssd-csi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yardwhisper-quarantine
  namespace: yardwhisper
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: freenas-iscsi-ssd-csi
  resources:
    requests:
      storage: 5Gi
